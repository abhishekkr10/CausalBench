name: Validate CausalBench
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Build native example (Unix)
        if: runner.os != 'Windows'
        run: g++ -std=c++17 -O2 controllers/native_guarded.cpp -o controllers/native_guarded
      - name: Build native example (Windows)
        if: runner.os == 'Windows'
        run: g++ -std=c++17 -O2 -static controllers/native_guarded.cpp -o controllers/native_guarded.exe
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/lab.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
